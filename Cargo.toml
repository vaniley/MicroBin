[package]
name = "MicroBin"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["vendor/tray-item"]
default-members = ["."]
resolver = "2"

[lib]
name = "microbin"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"

[target.'cfg(windows)'.dependencies]
tray-item = "0.10"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
]}

[build-dependencies]
embed-resource = "2.3"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
opt-level = 'z'

[[bin]]
name = "MicroBin"
path = "src/main.rs"

[patch.crates-io]
tray-item = { path = "vendor/tray-item" }
