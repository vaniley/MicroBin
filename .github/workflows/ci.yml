name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked
      - run: cargo test --locked -p tray-item --lib
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: cargo clippy --locked -p tray-item --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: MicroBin-windows-x64
          path: |
            target/release/MicroBin.exe
            config.example.toml
            README.md
            README.en.md
